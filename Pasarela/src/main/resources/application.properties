spring.application.name=Pasarela
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Service1 routes
spring.cloud.gateway.server.webmvc.routes[0].id=service1
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://Service1
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/service1

spring.cloud.gateway.server.webmvc.routes[1].id=service1-sub
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://Service1
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/service1/**

# Service2 routes
spring.cloud.gateway.server.webmvc.routes[2].id=service2
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://Service2
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/service2

spring.cloud.gateway.server.webmvc.routes[3].id=service2-sub
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://Service2
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/service2/**

# Service1 - Rutas de Equipos (Base de Datos)
spring.cloud.gateway.server.webmvc.routes[4].id=equipos
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://Service1
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/equipos

spring.cloud.gateway.server.webmvc.routes[5].id=equipos-sub
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://Service1
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/equipos/**

# Restricción 1: Límite de peticiones GET por ruta y cliente
gateway.rate-limit.max-requests=2
gateway.rate-limit.window-seconds=60

# Restricción 2: Clave secreta para operaciones de escritura (POST, PUT, PATCH, DELETE)
gateway.api-key=${GATEWAY_API_KEY:admin123}

