spring.application.name=Service1
server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Configuración de conexión MySQL (XAMPP)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_encuentrosdeportivos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate segura (no modifica tablas existentes)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

